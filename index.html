<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globi et l'Odyssée du corps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: red handheld console on a bright sky — pixel screen in a dark bezel, NES dialog box below, D-pad / Start pills / A-B buttons at the bottom. Single deliberate look. */
:root{
  --sky:#5f9dfa; --sky-dot:#86b6ff;
  --shell:#d63d34; --shell-shade:#a82a24; --shell-light:#f0756b; --shell-ink:#fff1e0;
  --bezel:#2a2333; --bezel-ink:#b9b0c8;
  --pad:#2a2333; --pad-hi:#463c55; --btn:#8a1530; --btn-hi:#b02445;
  --box:#0f1847; --box-hi:#1d2a6e; --box-hover:#2b3b8c; --edge:#f4f2ff; --ink:#f4f2ff; --muted:#aab0dc; --sub:#d6dbff;
  --gold:#f8c537; --red:#e8455a; --green:#3fbf6f;
  --kA:#e8455a; --kB:#f2c230; --kC:#3fbf6f; --kD:#4f8cf5;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"VT323","Courier New",monospace;
  --arcade:"Press Start 2P","Courier New",monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
body{
  background-color:var(--sky);
  background-image:radial-gradient(var(--sky-dot) 1.5px, transparent 1.7px);
  background-size:18px 18px;
  color:var(--ink); font-family:var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 32px;
}
.shell{
  max-width:780px; margin:0 auto; background:var(--shell);
  border-radius:16px 16px 60px 16px; padding:16px 16px 22px;
  box-shadow:inset -5px -7px 0 var(--shell-shade), inset 3px 3px 0 var(--shell-light), 0 12px 0 #233a7a;
}
.bezel{background:var(--bezel); border-radius:10px 10px 34px 10px; padding:10px 14px 16px}
.bezel-top{display:flex; justify-content:space-between; align-items:center; gap:8px; font-family:var(--display); font-size:11px; letter-spacing:.16em; color:var(--bezel-ink); margin-bottom:8px; text-transform:uppercase}
.led{display:inline-flex; align-items:center; gap:7px}
.led::before{content:""; width:8px; height:8px; border-radius:50%; background:#ff3b52; box-shadow:0 0 6px #ff3b52}
.hud{display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; font-family:var(--display); font-size:13px; color:#e9e6ff; margin-bottom:8px; min-height:22px; letter-spacing:.06em}
.hearts{display:flex; align-items:center; gap:3px}
.hearts svg{width:18px; height:16px; display:block}
.hearts.shake{animation:shake .35s steps(4)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.lvl,.vit,.bdg{display:flex; align-items:center; gap:7px}
.vit svg,.bdg svg{width:15px; height:15px; display:block}
.xp{width:72px; height:9px; background:#151332; border:2px solid #57527e; position:relative}
.xp i{position:absolute; inset:0 auto 0 0; width:0; background:var(--gold); transition:width .4s steps(8)}
.screen{position:relative; border:3px solid #07061a; background:#000; overflow:hidden}
#cv{display:block; width:100%; height:auto; aspect-ratio:16/9; image-rendering:crisp-edges; image-rendering:pixelated; cursor:pointer; outline:none; touch-action:manipulation}
.logo{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding-top:7%; pointer-events:none; text-align:center}
.logo h1{font-family:var(--display); font-weight:700; font-size:clamp(36px,10vw,80px); color:var(--gold); letter-spacing:.08em; margin:0; line-height:1; text-shadow:3px 3px 0 #c0480f, 6px 6px 0 #1a0b10}
.logo p{font-family:var(--display); font-weight:600; font-size:clamp(11px,2.6vw,18px); color:#fff; text-shadow:2px 2px 0 #1a0b10; margin:.5em 0 0; letter-spacing:.1em; text-transform:uppercase}
.tag{position:absolute; top:22px; left:8px; font-family:var(--display); font-size:clamp(10px,2vw,13px); color:#fff; background:rgba(5,8,31,.75); padding:3px 8px; letter-spacing:.14em; text-transform:uppercase}
.ecard{position:absolute; top:12%; right:3%; min-width:40%; background:#f3f0ff; color:#1a1830; border:2px solid #1a1830; border-radius:4px 4px 14px 4px; padding:4px 10px 7px; font-family:var(--display); font-size:clamp(11px,2.3vw,16px); box-shadow:3px 3px 0 rgba(0,0,0,.45)}
.ecard .hp{display:flex; align-items:center; gap:6px; margin-top:3px; font-size:.75em; color:#9a6a00; font-weight:700}
.ecard .bar{flex:1; height:8px; background:#2a2840; border:1px solid #1a1830; position:relative}
.ecard .bar i{position:absolute; inset:0 auto 0 0; background:#3fbf6f; transition:width .5s .35s steps(10)}
.ecard .bar.mid i{background:#f2c230} .ecard .bar.low i{background:#e8455a}
.ecard .num{font-variant-numeric:tabular-nums; color:#1a1830; min-width:3.2em; text-align:right}

.panel{margin-top:16px; background:var(--box); border:3px solid var(--edge); border-radius:6px; box-shadow:0 0 0 3px #070b26, 4px 6px 0 3px rgba(0,0,0,.25); padding:14px 16px 16px; font-size:22px; line-height:1.15; min-height:170px; display:flex; flex-direction:column; gap:10px}
.panel p,.modal p{margin:0; max-width:66ch}
.panel h2,.modal h2{font-family:var(--display); font-size:20px; margin:0; color:var(--gold); letter-spacing:.04em; text-wrap:balance}
.gold{color:var(--gold); font-weight:normal}
.btn{font-family:var(--display); font-size:15px; font-weight:600; color:var(--ink); background:var(--box-hi); border:2px solid var(--edge); border-radius:4px; padding:8px 14px; cursor:pointer; box-shadow:0 3px 0 #050826; letter-spacing:.03em}
.btn:hover{background:var(--box-hover)}
.btn:focus-visible,.ans:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.btn:active,.ans:active{transform:translateY(2px); box-shadow:0 1px 0 #050826}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.small{font-size:13px; padding:6px 10px}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.hint{color:var(--muted); font-size:18px}
.speaker{font-family:var(--display); font-size:13px; letter-spacing:.14em; color:var(--gold); text-transform:uppercase}
.say{min-height:2.4em; font-size:24px}
.question{font-size:25px; line-height:1.1}
.qhead{display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-family:var(--display); font-size:12px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.streak{color:var(--gold)}
.answers{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.ans{display:flex; align-items:center; gap:10px; text-align:left; font-family:var(--body); font-size:21px; line-height:1.05; color:var(--ink); background:var(--box-hi); border:2px solid #4a58a8; border-radius:6px; padding:8px 10px; min-height:52px; cursor:pointer; box-shadow:0 3px 0 #050826; min-width:0}
.ans span:last-child{min-width:0}
.ans:hover{border-color:var(--edge); background:var(--box-hover)}
.ans:disabled{cursor:default}
.ans:disabled:not(.good):not(.bad){opacity:.5}
.ans.good{background:#1b6a40; border-color:#8ff0b4; opacity:1}
.ans.bad{background:#7c1d2e; border-color:#ffa8b4; opacity:1}
.k{flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-size:13px; font-weight:700; color:#14112a; box-shadow:inset -2px -3px 0 rgba(0,0,0,.28), 0 2px 0 #050826}
.k0{background:var(--kA)} .k1{background:var(--kB)} .k2{background:var(--kC)} .k3{background:var(--kD)}
.after{display:flex; flex-direction:column; gap:8px}
.fb{font-family:var(--display); font-size:15px; padding:6px 10px; border-radius:4px; letter-spacing:.02em}
.fb.ok{background:rgba(63,191,111,.18); color:#8ff0b4}
.fb.no{background:rgba(232,69,90,.22); color:#ffb4bf}
.fb.lv{background:rgba(248,197,55,.18); color:var(--gold)}
.expl{color:var(--sub)}
.zhead{display:flex; align-items:center; gap:10px}
.chip{width:14px; height:14px; background:var(--c); box-shadow:2px 2px 0 #050826; flex:none}
.meta{font-size:19px; color:var(--muted)}
.meta b{color:var(--ink); font-weight:normal}
.meta .won{color:var(--gold)}
.fiche{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px}
.fiche li{padding-left:22px; position:relative; max-width:70ch; font-size:21px; line-height:1.1}
.fiche li::before{content:""; position:absolute; left:4px; top:.42em; width:8px; height:8px; background:var(--c, var(--gold))}
.fiche b{color:var(--gold); font-weight:normal}
.reward{display:flex; align-items:center; gap:14px; background:rgba(248,197,55,.1); border:2px dashed rgba(248,197,55,.5); padding:10px 12px; border-radius:6px}
.medal{width:34px; height:34px; border-radius:50%; background:var(--c); border:3px solid var(--gold); box-shadow:0 3px 0 #050826; flex:none}
.warn{color:#ff9ad1}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px}
.stat{background:var(--box-hi); border:2px solid #4a58a8; padding:8px 10px; border-radius:4px}
.stat b{display:block; font-family:var(--display); font-size:22px; color:var(--gold); font-variant-numeric:tabular-nums}

/* ----- Commandes de la console ----- */
.controls{display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"dpad mid ab"; align-items:center; gap:14px; margin-top:22px; padding:0 4px; user-select:none; -webkit-user-select:none}
.dpad{grid-area:dpad; position:relative; width:108px; height:108px}
.dpad::before{content:""; position:absolute; left:36px; top:0; width:36px; height:108px; background:var(--pad); border-radius:5px; box-shadow:0 4px 0 #160f1d}
.dpad::after{content:""; position:absolute; top:36px; left:0; width:108px; height:36px; background:var(--pad); border-radius:5px; box-shadow:0 4px 0 #160f1d}
.dk{position:absolute; z-index:2; width:36px; height:36px; border:none; background:transparent; color:#8f86a3; font-size:13px; cursor:pointer; touch-action:none; display:grid; place-items:center; border-radius:4px}
.dk:active,.dk.on{background:var(--pad-hi); color:#fff}
.dk:focus-visible{outline:3px solid var(--gold)}
.dk.l{left:0; top:36px} .dk.r{right:0; top:36px} .dk.u{left:36px; top:0} .dk.d{left:36px; bottom:0; cursor:default}
.dcenter{position:absolute; z-index:2; left:46px; top:46px; width:16px; height:16px; border-radius:50%; background:#1e1826; pointer-events:none}
.mid{grid-area:mid; display:flex; flex-direction:column; align-items:center; gap:12px}
.brand{font-family:var(--display); font-style:italic; font-weight:700; color:var(--shell-ink); font-size:18px; letter-spacing:.06em; text-shadow:2px 2px 0 var(--shell-shade)}
.brand span:nth-child(1){color:#ffd23f} .brand span:nth-child(2){color:#7ff0a4} .brand span:nth-child(3){color:#7fd6ff}
.pills{display:flex; gap:16px; flex-wrap:wrap; justify-content:center}
.pill{display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:6px 4px 2px; font-family:var(--display); font-size:11px; font-weight:600; letter-spacing:.14em; color:var(--shell-ink)}
.pill::before{content:""; width:42px; height:12px; border-radius:8px; background:var(--pad); transform:rotate(-24deg); box-shadow:inset -2px -2px 0 #160f1d}
.pill[aria-pressed="false"]::before{background:#8f5a60}
.pill:active::before{transform:rotate(-24deg) translateY(2px)}
.pill:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
.ab{grid-area:ab; display:flex; gap:14px; align-items:flex-end; transform:rotate(-18deg); padding-right:4px}
.abw{display:flex; flex-direction:column; align-items:center; gap:6px; font-family:var(--display); font-size:10px; font-weight:600; letter-spacing:.12em; color:var(--shell-ink)}
.abw:last-child{margin-bottom:22px}
.abk{width:52px; height:52px; border-radius:50%; border:none; background:var(--btn); color:#ffd9de; font-family:var(--arcade); font-size:13px; cursor:pointer; box-shadow:inset -3px -4px 0 rgba(0,0,0,.3), 0 4px 0 #4a0a18; touch-action:none}
.abk:active,.abk.on{background:var(--btn-hi); transform:translateY(2px); box-shadow:inset -3px -4px 0 rgba(0,0,0,.3), 0 2px 0 #4a0a18}
.abk:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

.modal{position:fixed; inset:0; background:rgba(8,6,24,.8); display:grid; place-items:center; z-index:50; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px))}
.modal .box{background:var(--box); border:3px solid var(--edge); box-shadow:0 0 0 3px #070b26; border-radius:6px; max-width:640px; width:100%; max-height:85vh; overflow:auto; padding:16px 18px; font-size:21px; line-height:1.15; display:flex; flex-direction:column; gap:12px}
.codex{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px}
.cx{display:flex; align-items:center; gap:10px; text-align:left}
.keys{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:center}
.keys kbd{font-family:var(--display); font-size:13px; background:var(--box-hi); border:2px solid #4a58a8; padding:2px 8px; border-radius:4px; white-space:nowrap}

@media (max-width:560px){
  .answers{grid-template-columns:1fr}
  .shell{padding:10px 10px 18px; border-radius:12px 12px 40px 12px}
  .bezel{padding:8px 8px 12px; border-radius:8px 8px 24px 8px}
  .panel{font-size:20px; padding:12px; min-height:150px}
  .question{font-size:22px}
  .say{font-size:22px}
  .ans{font-size:20px; min-height:46px}
  .bezel-top span:last-child{display:none}
  .controls{grid-template-columns:auto auto; grid-template-areas:"dpad ab" "mid mid"; justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){
  .hearts.shake{animation:none}
  .xp i,.ecard .bar i{transition:none}
}
</style>
</head>
<body>

<div class="shell">
  <div class="bezel">
    <div class="bezel-top"><span class="led">Batterie</span><span>Sciences · Secondaire 3 · L’être humain</span></div>
    <div class="hud" id="hud" hidden>
      <div class="hearts" id="hearts" aria-label="Cœurs"></div>
      <div class="lvl"><span id="lvl">NIV 1</span><span class="xp" title="Expérience"><i id="xpbar"></i></span></div>
      <div class="vit" id="vit"></div>
      <div class="bdg" id="bdg"></div>
    </div>
    <div class="screen">
      <canvas id="cv" width="640" height="360" tabindex="-1" aria-label="Écran de jeu"></canvas>
      <div class="logo" id="logo"><h1>GLOBI</h1><p>et l’Odyssée du corps</p></div>
      <div class="tag" id="tag" hidden>Fiche du savoir</div>
      <div class="ecard" id="ecard" hidden>
        <div id="ename">—</div>
        <div class="hp">PV<div class="bar" id="ebarWrap"><i id="ebar"></i></div><span class="num" id="enum">5/5</span></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel" aria-live="polite"></div>

  <div class="controls">
    <div class="dpad" aria-label="Croix directionnelle">
      <button class="dk u" data-key="jump" aria-label="Sauter">▲</button>
      <button class="dk l" data-key="left" aria-label="Gauche">◀</button>
      <button class="dk r" data-key="right" aria-label="Droite">▶</button>
      <button class="dk d" tabindex="-1" aria-hidden="true">▼</button>
      <span class="dcenter"></span>
    </div>
    <div class="mid">
      <div class="brand">GLOBI <span>B</span><span>I</span><span>O</span></div>
      <div class="pills">
        <button class="pill" id="pSound" data-act="toggleSound" aria-pressed="true">SON</button>
        <button class="pill" data-act="codex">CODEX</button>
        <button class="pill" data-act="help">AIDE</button>
      </div>
    </div>
    <div class="ab">
      <div class="abw"><button class="abk" data-key="run" aria-label="Courir">B</button>COURIR</div>
      <div class="abw"><button class="abk" data-key="jump" aria-label="Sauter">A</button>SAUTER</div>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box" id="mbox"></div></div>

<script>
/* =========================================================
   DONNÉES — systèmes du corps humain (Secondaire 3)
   q.o[0] est toujours la bonne réponse (mélangée à l’affichage)
   ========================================================= */
const SYS = [
{ id:'dig', nom:'Système digestif', court:'Digestif', fonction:'Fonction de nutrition', color:'#f0a03a', part:'food', node:[153,84],
  blurb:'Le long tube qui transforme ton repas en nutriments. Une bactérie ronge la paroi de l’estomac.',
  ennemi:{nom:'Ulcérax', type:'bacille', pal:{a:'#7bc950',b:'#3f7a25',o:'#173a10',h:'#c8f29a'}},
  intro:'Il ronge la paroi de l’estomac! Réponds juste pour l’arrêter.',
  fiche:[
    '<b>Rôle :</b> transformer les aliments en nutriments assez petits pour passer dans le sang.',
    '<b>Tube digestif :</b> bouche → pharynx → œsophage → estomac → intestin grêle → gros intestin → anus.',
    '<b>Glandes digestives :</b> glandes salivaires, glandes gastriques, foie (bile), pancréas (suc pancréatique) et glandes intestinales.',
    '<b>Transformation mécanique</b> (mastication, brassage) et <b>chimique</b> (enzymes digestives, comme l’amylase de la salive).',
    '<b>Absorption :</b> surtout dans l’intestin grêle, grâce aux villosités. Le gros intestin absorbe surtout l’eau.'
  ],
  q:[
    {q:'Dans quel organe se fait la majeure partie de l’absorption des nutriments?', o:['L’intestin grêle','L’estomac','Le gros intestin','L’œsophage'], e:'Les villosités de l’intestin grêle forment une immense surface d’échange avec le sang.'},
    {q:'Quel est le rôle principal du gros intestin?', o:['Absorber l’eau et former les selles','Produire la bile','Digérer les protéines','Broyer les aliments'], e:'Les nutriments ont déjà été absorbés dans l’intestin grêle. Le gros intestin récupère surtout l’eau.'},
    {q:'Quelle glande digestive produit la bile?', o:['Le foie','La vésicule biliaire','Le pancréas','Les glandes salivaires'], e:'Le foie fabrique la bile; la vésicule biliaire ne fait que l’emmagasiner. La bile émulsionne les lipides.'},
    {q:'La mastication des aliments est une transformation…', o:['mécanique','chimique','hormonale','nerveuse'], e:'Couper, broyer et brasser fragmentent les aliments sans changer leur nature. Les enzymes, elles, font la transformation chimique.'},
    {q:'L’amylase de la salive commence la digestion de quel nutriment?', o:['Les glucides (amidon)','Les lipides','Les protéines','Les vitamines'], e:'Dès la bouche, l’amylase salivaire découpe l’amidon en sucres plus simples.'},
    {q:'Dans quel ordre le bol alimentaire voyage-t-il?', o:['Bouche → pharynx → œsophage → estomac','Bouche → œsophage → pharynx → estomac','Bouche → larynx → œsophage → estomac','Bouche → trachée → estomac → intestin'], e:'Le pharynx est le carrefour entre la bouche et l’œsophage. L’épiglotte empêche les aliments d’entrer dans le larynx.'},
    {q:'Lequel de ces éléments est absorbé sans avoir besoin d’être digéré?', o:['L’eau','L’amidon','Les protéines','Les lipides'], e:'L’eau, les sels minéraux et les vitamines sont déjà assez petits pour être absorbés directement.'}
  ]},
{ id:'res', nom:'Système respiratoire', court:'Respiratoire', fonction:'Fonction de nutrition', color:'#5ab8f0', part:'bubble', node:[149,55],
  blurb:'Des fosses nasales jusqu’aux alvéoles. Un nuage de fumée toxique bloque les bronches.',
  ennemi:{nom:'Fumigor', type:'nuage', pal:{a:'#a9a7b8',b:'#6e6b80',o:'#2c2a3a',h:'#e4e2ef'}},
  intro:'Il obstrue les bronches de Max! Chaque bonne réponse dissipe la fumée.',
  fiche:[
    '<b>Rôle :</b> capter le dioxygène (O₂) de l’air et rejeter le dioxyde de carbone (CO₂).',
    '<b>Voies respiratoires :</b> fosses nasales → pharynx → larynx → trachée → bronches → bronchioles → alvéoles pulmonaires.',
    '<b>Échanges gazeux :</b> par diffusion, entre les alvéoles et les capillaires sanguins.',
    '<b>Inspiration :</b> le diaphragme se contracte et s’abaisse, la cage thoracique s’agrandit, l’air entre.',
    '<b>Expiration :</b> le diaphragme se relâche et remonte, le volume des poumons diminue, l’air sort.'
  ],
  q:[
    {q:'Où se produisent les échanges gazeux entre l’air et le sang?', o:['Dans les alvéoles pulmonaires','Dans la trachée','Dans les bronches','Dans le larynx'], e:'Les alvéoles ont une paroi très mince entourée de capillaires : l’O₂ et le CO₂ la traversent par diffusion.'},
    {q:'Pendant l’inspiration, le diaphragme…', o:['se contracte et s’abaisse','se relâche et remonte','reste immobile','se contracte et remonte'], e:'En s’abaissant, le diaphragme augmente le volume de la cage thoracique. La pression baisse et l’air entre.'},
    {q:'Quel organe contient les cordes vocales?', o:['Le larynx','Le pharynx','La trachée','Les bronches'], e:'Le larynx, situé au-dessus de la trachée, contient les cordes vocales qui vibrent pour produire la voix.'},
    {q:'Quel gaz passe du sang vers les alvéoles pour être expiré?', o:['Le dioxyde de carbone (CO₂)','Le dioxygène (O₂)','L’azote (N₂)','L’hydrogène (H₂)'], e:'Le CO₂, déchet des cellules, est plus concentré dans le sang que dans l’air des alvéoles : il diffuse vers les alvéoles.'},
    {q:'Quel est le rôle des fosses nasales?', o:['Réchauffer, humidifier et filtrer l’air','Faire les échanges gazeux','Produire la voix','Transporter l’O₂ dans le sang'], e:'Les poils et le mucus retiennent les poussières; l’air y est aussi réchauffé et humidifié.'},
    {q:'Quel conduit est commun aux systèmes respiratoire et digestif?', o:['Le pharynx','L’œsophage','La trachée','Les bronches'], e:'L’air et les aliments passent tous les deux par le pharynx. Ensuite, l’air va dans le larynx et les aliments dans l’œsophage.'},
    {q:'Par quel phénomène l’O₂ passe-t-il des alvéoles vers le sang?', o:['La diffusion','La filtration','La digestion','La contraction'], e:'La diffusion déplace une substance d’un milieu plus concentré vers un milieu moins concentré.'}
  ]},
{ id:'cir', nom:'Système circulatoire', court:'Circulatoire', fonction:'Fonction de nutrition', color:'#e8455a', part:'rbc', node:[168,60],
  blurb:'Le cœur et des milliers de kilomètres de vaisseaux. Un caillot géant menace la circulation.',
  ennemi:{nom:'Caillotron', type:'caillot', pal:{a:'#c3283f',b:'#7e1022',o:'#3a0610',h:'#f7e6c8'}},
  intro:'Il bloque une artère! Dissous-le avec tes connaissances.',
  fiche:[
    '<b>Rôle :</b> transporter l’O₂, les nutriments, les déchets et les hormones dans tout le corps.',
    '<b>Le cœur a 4 cavités :</b> 2 oreillettes (reçoivent le sang) et 2 ventricules (propulsent le sang).',
    '<b>Circulation pulmonaire :</b> cœur → poumons → cœur. <b>Circulation systémique :</b> cœur → organes → cœur.',
    '<b>Vaisseaux :</b> artères (partent du cœur), veines (reviennent au cœur, avec valvules), capillaires (lieu des échanges).',
    '<b>Sang :</b> plasma (≈ 55 %), globules rouges (O₂), globules blancs (défense), plaquettes (coagulation).'
  ],
  q:[
    {q:'Quels vaisseaux transportent le sang du cœur vers les organes?', o:['Les artères','Les veines','Les vaisseaux lymphatiques','Les uretères'], e:'Les artères partent du cœur. Leur paroi épaisse et élastique résiste à la forte pression du sang.'},
    {q:'Quelle composante du sang transporte l’O₂?', o:['Les globules rouges','Les globules blancs','Les plaquettes','Le plasma'], e:'Les globules rouges contiennent l’hémoglobine, une protéine qui fixe le dioxygène.'},
    {q:'Quel est le rôle des plaquettes?', o:['Aider à la coagulation du sang','Transporter l’O₂','Produire des anticorps','Transporter la bile'], e:'Lors d’une blessure, les plaquettes s’agglutinent et forment un caillot qui arrête le saignement.'},
    {q:'Quelle cavité du cœur propulse le sang vers tout le corps?', o:['Le ventricule gauche','Le ventricule droit','L’oreillette gauche','L’oreillette droite'], e:'Le ventricule gauche envoie le sang dans l’aorte (circulation systémique). Sa paroi est la plus épaisse du cœur.'},
    {q:'À quoi sert la circulation pulmonaire?', o:['Oxygéner le sang dans les poumons','Nourrir les muscles des jambes','Filtrer le sang dans les reins','Transporter les nutriments de l’intestin'], e:'Le ventricule droit envoie le sang aux poumons, où il rejette le CO₂ et capte l’O₂, puis il revient à l’oreillette gauche.'},
    {q:'Quel groupe sanguin est le donneur universel de globules rouges?', o:['O−','AB+','A+','B−'], e:'Les globules rouges O− n’ont ni antigène A, ni B, ni Rh : on peut les donner à tous les groupes.'},
    {q:'Quels vaisseaux possèdent des valvules qui empêchent le sang de refluer?', o:['Les veines','Les artères','Les capillaires','L’aorte seulement'], e:'Dans les veines, la pression est faible. Les valvules empêchent le sang de redescendre, surtout dans les jambes.'}
  ]},
{ id:'lym', nom:'Système lymphatique', court:'Lymphatique', fonction:'Fonction de nutrition', color:'#4fd1a5', part:'lymph', node:[129,52],
  blurb:'Le réseau discret qui draine les tissus et défend le corps. Un œdème fait tout enfler.',
  ennemi:{nom:'Œdémax', type:'goutte', pal:{a:'#6fc3e8',b:'#2f86b8',o:'#123a5a',h:'#e2f6ff'}},
  intro:'Toute la lymphe s’accumule autour de lui! Fais circuler tes réponses.',
  fiche:[
    '<b>Rôle :</b> récupérer le liquide (la lymphe) qui s’échappe des capillaires et le retourner dans le sang.',
    '<b>Circulation :</b> la lymphe n’a pas de pompe; ce sont les contractions des muscles qui la font avancer.',
    '<b>Ganglions lymphatiques :</b> ils filtrent la lymphe et abritent des globules blancs.',
    '<b>Organes lymphatiques :</b> ganglions, rate, thymus, amygdales.',
    '<b>Défense :</b> des lymphocytes produisent des anticorps spécifiques à un antigène. Un vaccin stimule cette production.'
  ],
  q:[
    {q:'Quel est le rôle principal du système lymphatique?', o:['Retourner au sang le liquide sorti des capillaires','Pomper le sang dans les artères','Filtrer le sang pour faire l’urine','Produire la bile'], e:'Une partie du plasma s’échappe des capillaires. Les vaisseaux lymphatiques la récupèrent (lymphe) et la ramènent dans le sang.'},
    {q:'Où la lymphe est-elle filtrée?', o:['Dans les ganglions lymphatiques','Dans les reins','Dans le foie','Dans les alvéoles'], e:'Les ganglions retiennent les microbes et contiennent beaucoup de globules blancs. Ils enflent parfois quand on est malade.'},
    {q:'Qu’est-ce qui fait avancer la lymphe dans les vaisseaux lymphatiques?', o:['Les contractions des muscles squelettiques','Le cœur','Les reins','La moelle épinière'], e:'Le système lymphatique n’a pas de pompe : les muscles pressent les vaisseaux, et des valvules empêchent le retour.'},
    {q:'Quelles cellules produisent les anticorps?', o:['Certains lymphocytes (globules blancs)','Les globules rouges','Les plaquettes','Les neurones'], e:'Les lymphocytes fabriquent des anticorps qui reconnaissent et neutralisent un antigène précis.'},
    {q:'Comment appelle-t-on une substance étrangère qui déclenche la production d’anticorps?', o:['Un antigène','Une enzyme','Une hormone','Un nutriment'], e:'Un antigène est une molécule reconnue comme étrangère, par exemple à la surface d’un virus ou d’une bactérie.'},
    {q:'Que contient généralement un vaccin?', o:['Un agent pathogène affaibli ou inactivé, ou une partie de celui-ci','Des anticorps déjà fabriqués','Des antibiotiques','Des globules rouges'], e:'Le vaccin présente un antigène sans danger : le corps produit des anticorps et garde une mémoire immunitaire.'},
    {q:'Lequel de ces organes fait partie du système lymphatique?', o:['La rate','Le pancréas','La vessie','L’estomac'], e:'La rate, le thymus, les amygdales et les ganglions sont des organes lymphatiques.'}
  ]},
{ id:'exc', nom:'Système excréteur', court:'Excréteur', fonction:'Fonction de nutrition', color:'#f2d35a', part:'drop', node:[172,94],
  blurb:'Les reins filtrent le sang jour et nuit. Un calcul bloque les voies urinaires.',
  ennemi:{nom:'Calculoz', type:'rocher', pal:{a:'#d9b45a',b:'#a07a2c',o:'#3d2a0c',h:'#fff2a8'}},
  intro:'Il bouche un uretère! Brise-le à coups de bonnes réponses.',
  fiche:[
    '<b>Rôle :</b> éliminer les déchets produits par les cellules et maintenir l’équilibre de l’eau et des sels.',
    '<b>Voies urinaires :</b> reins → uretères → vessie → urètre.',
    '<b>Les reins filtrent le sang.</b> Le néphron est l’unité de filtration du rein (environ un million par rein).',
    '<b>L’urine</b> contient surtout de l’eau, de l’urée et des sels minéraux.',
    '<b>Autres organes excréteurs :</b> poumons (CO₂ et vapeur d’eau), peau (sueur).'
  ],
  q:[
    {q:'Quel organe filtre le sang pour produire l’urine?', o:['Les reins','La vessie','Le foie','Les uretères'], e:'Les reins filtrent le sang en continu. La majeure partie du liquide filtré est réabsorbée; le reste devient l’urine.'},
    {q:'Quel est le rôle de la vessie?', o:['Emmagasiner l’urine','Filtrer le sang','Produire l’urée','Absorber l’eau des aliments'], e:'La vessie est un réservoir musculaire qui accumule l’urine avant son évacuation par l’urètre.'},
    {q:'Quels conduits transportent l’urine des reins à la vessie?', o:['Les uretères','L’urètre','Les bronches','Les trompes de Fallope'], e:'Attention : les uretères (deux) vont des reins à la vessie; l’urètre (un seul) va de la vessie vers l’extérieur.'},
    {q:'Quelle est l’unité de filtration du rein?', o:['Le néphron','Le neurone','L’alvéole','La villosité'], e:'Chaque rein contient environ un million de néphrons qui filtrent le sang et forment l’urine.'},
    {q:'Quel déchet, produit par le foie, est le principal déchet de l’urine?', o:['L’urée','Le glucose','L’hémoglobine','Le dioxygène'], e:'L’urée vient de la dégradation des protéines. Le sang la transporte jusqu’aux reins.'},
    {q:'En plus des reins, quel organe excrète du CO₂?', o:['Les poumons','L’estomac','La vessie','Le cœur'], e:'Les poumons rejettent le CO₂ et de la vapeur d’eau. La peau excrète aussi de la sueur.'},
    {q:'En plus d’éliminer des déchets, les reins…', o:['régulent la quantité d’eau et de sels du corps','produisent la bile','digèrent les protéines','produisent les anticorps'], e:'Si tu bois beaucoup, l’urine est abondante et diluée; si tu manques d’eau, elle est plus concentrée.'}
  ]},
{ id:'mus', nom:'Système musculosquelettique', court:'Musculosquel.', fonction:'Fonction de relation', color:'#ff8a6b', part:'fiber', node:[149,148],
  blurb:'206 os et plus de 600 muscles. Un os fracturé fait grincer toutes les articulations.',
  ennemi:{nom:'Fractura', type:'os', pal:{a:'#eee3cf',b:'#bfae90',o:'#3d3428',h:'#ffffff'}},
  intro:'Il fait grincer toutes les articulations! Tiens bon.',
  fiche:[
    '<b>Le squelette adulte compte 206 os.</b> Fonctions : soutenir, protéger, permettre le mouvement, fabriquer les cellules sanguines (moelle rouge) et stocker des minéraux (calcium).',
    '<b>Articulations :</b> immobiles (os du crâne), semi-mobiles (vertèbres), mobiles (genou, épaule).',
    '<b>Ligaments :</b> relient un os à un os. <b>Tendons :</b> relient un muscle à un os.',
    '<b>3 types de muscles :</b> squelettiques (volontaires), lisses (involontaires, organes), cardiaque (involontaire, cœur).',
    '<b>Un muscle ne peut que tirer</b> en se contractant : les muscles travaillent en paires antagonistes (biceps / triceps).'
  ],
  q:[
    {q:'Combien d’os compte le squelette d’un adulte?', o:['206','106','306','260'], e:'Un bébé en a davantage (environ 300), mais plusieurs os se soudent pendant la croissance.'},
    {q:'Quelle structure relie un muscle à un os?', o:['Le tendon','Le ligament','Le cartilage','Le nerf'], e:'Tendon : muscle → os. Ligament : os → os, au niveau des articulations.'},
    {q:'Pour plier le bras au coude, quel muscle se contracte?', o:['Le biceps','Le triceps','Le deltoïde','Le quadriceps'], e:'Le biceps se contracte et tire l’avant-bras vers le haut; son antagoniste, le triceps, se relâche.'},
    {q:'Quel type de muscle se trouve dans la paroi de l’estomac?', o:['Le muscle lisse','Le muscle squelettique','Le muscle cardiaque','Le muscle volontaire'], e:'Les muscles lisses tapissent les organes creux (estomac, intestins, vaisseaux). Ils sont involontaires.'},
    {q:'Où sont fabriquées les cellules sanguines?', o:['Dans la moelle rouge des os','Dans la moelle épinière','Dans les ligaments','Dans le cartilage'], e:'Piège classique : la moelle rouge (dans les os) fabrique les cellules du sang; la moelle épinière fait partie du système nerveux.'},
    {q:'Chez l’adulte, les os du crâne sont reliés par des articulations…', o:['immobiles','mobiles','semi-mobiles','à pivot'], e:'Les os du crâne sont soudés par des sutures : l’articulation ne bouge pas et protège l’encéphale.'},
    {q:'Laquelle de ces fonctions n’est PAS une fonction du squelette?', o:['Digérer les aliments','Protéger les organes','Soutenir le corps','Mettre en réserve du calcium'], e:'Le squelette soutient, protège, permet le mouvement, fabrique les cellules sanguines et stocke des minéraux.'}
  ]},
{ id:'ner', nom:'Système nerveux', court:'Nerveux', fonction:'Fonction de relation', color:'#a77ee8', part:'spark', node:[160,19],
  blurb:'Le centre de commande du corps, avec les organes des sens. Un neurone déréglé envoie des influx dans tous les sens.',
  ennemi:{nom:'Névralgor', type:'neurone', pal:{a:'#9b6be0',b:'#5c34a3',o:'#22113f',h:'#ffe66b'}},
  intro:'Il brouille les influx nerveux! Garde l’esprit clair.',
  fiche:[
    '<b>Rôle :</b> recevoir l’information, l’analyser et commander une réponse.',
    '<b>SNC :</b> encéphale (cerveau, cervelet, tronc cérébral) et moelle épinière. <b>SNP :</b> les nerfs.',
    '<b>Neurone :</b> dendrites (reçoivent l’influx), corps cellulaire, axone (transmet l’influx). La synapse relie deux neurones.',
    '<b>Cerveau :</b> pensée, mémoire, mouvements volontaires. <b>Cervelet :</b> équilibre et coordination. <b>Bulbe rachidien :</b> respiration, rythme cardiaque.',
    '<b>Réflexe :</b> réponse rapide et involontaire commandée par la moelle épinière.',
    '<b>Sens :</b> l’œil (rétine : cônes et bâtonnets), l’oreille (cochlée pour l’ouïe, canaux semi-circulaires pour l’équilibre), la peau, le nez, la langue.'
  ],
  q:[
    {q:'Quelle partie du neurone reçoit l’influx nerveux?', o:['Les dendrites','L’axone','La synapse','La gaine de myéline'], e:'Les dendrites captent l’influx et l’amènent au corps cellulaire; l’axone le transmet ensuite plus loin.'},
    {q:'Quelle partie de l’encéphale coordonne les mouvements et l’équilibre?', o:['Le cervelet','Le cerveau','Le bulbe rachidien','L’hypophyse'], e:'Le cervelet, à l’arrière sous le cerveau, ajuste les mouvements pour qu’ils soient précis et coordonnés.'},
    {q:'Quand tu retires ta main d’un objet brûlant, ce réflexe est d’abord traité par…', o:['la moelle épinière','le cerveau','le cervelet','le nerf optique'], e:'Dans un arc réflexe, la moelle épinière commande la réponse directement. Le cerveau reçoit l’information juste après : tu sens la douleur.'},
    {q:'Le système nerveux central (SNC) est formé…', o:['de l’encéphale et de la moelle épinière','des nerfs et de la moelle épinière','du cerveau seulement','des nerfs crâniens et rachidiens'], e:'Les nerfs forment le système nerveux périphérique, qui relie le SNC au reste du corps.'},
    {q:'Quelle structure de l’œil contient les cellules sensibles à la lumière?', o:['La rétine','Le cristallin','L’iris','La cornée'], e:'La rétine contient les cônes (couleurs) et les bâtonnets (faible lumière). Le nerf optique transmet le message au cerveau.'},
    {q:'Quelle partie de l’oreille interne participe à l’équilibre?', o:['Les canaux semi-circulaires','La cochlée','Le tympan','Le pavillon'], e:'Les canaux semi-circulaires détectent les mouvements de la tête. La cochlée, elle, sert à l’audition.'},
    {q:'Que contrôle le bulbe rachidien?', o:['La respiration et le rythme cardiaque','La mémoire','Le langage','La vision des couleurs'], e:'Le bulbe rachidien, dans le tronc cérébral, gère des fonctions vitales automatiques.'}
  ]},
{ id:'rep', nom:'Système reproducteur', court:'Reproducteur', fonction:'Fonction de reproduction', color:'#ff7ac8', hp:7, part:'cell', node:[160,112],
  blurb:'Les organes qui assurent la continuité de l’espèce. Un virus transmis sexuellement s’y cache.',
  ennemi:{nom:'Virionix', type:'virus', pal:{a:'#e85fb3',b:'#9c2a72',o:'#3d0a2b',h:'#ffd0ec'}},
  intro:'Ce virus se cache dans le système reproducteur! Montre ce que tu sais.',
  fiche:[
    '<b>Rôle :</b> produire des gamètes (cellules reproductrices) et permettre la naissance d’un nouvel être humain.',
    '<b>Spermatogenèse :</b> dans les tubes séminifères des testicules, dès la puberté et en continu toute la vie. Le scrotum garde les testicules un peu plus frais que le corps. Trajet : épididyme → canal déférent → urètre.',
    '<b>Érection :</b> les corps caverneux du pénis se remplissent de sang. <b>Éjaculation :</b> des contractions expulsent le sperme par l’urètre. Sperme = spermatozoïdes + liquide séminal (vésicules séminales, prostate, glandes de Cowper).',
    '<b>Ovogenèse :</b> la fille naît avec un stock limité d’ovules immatures. De la puberté à la ménopause, environ un ovule mûrit par cycle dans un follicule. Fécondation dans la trompe de Fallope; nidation dans l’utérus.',
    '<b>Cycle ovarien :</b> phase folliculaire (le follicule mûrit et produit de l’œstrogène) → ovulation vers le 14ᵉ jour (pic de LH) → phase lutéale (le corps jaune produit de la progestérone).',
    '<b>Cycle menstruel :</b> menstruations (jours 1 à 5 environ, l’endomètre se détache) → l’endomètre s’épaissit (œstrogène) → il est maintenu (progestérone). Sans fécondation, la progestérone chute et un nouveau cycle commence.',
    '<b>Hormones :</b> l’hypophyse sécrète la FSH et la LH. Femme : la FSH fait mûrir le follicule, la LH déclenche l’ovulation. Homme : la FSH stimule la spermatogenèse, la LH stimule la production de testostérone.',
    '<b>Méthode du calendrier :</b> éviter les relations sexuelles pendant la période fertile autour de l’ovulation (ovule fécondable ≈ 24 h, spermatozoïdes vivants jusqu’à ≈ 5 jours). Peu fiable, car l’ovulation varie, et elle ne protège pas des ITSS.',
    '<b>Le condom</b> est le seul moyen de contraception qui protège aussi contre les ITSS.'
  ],
  q:[
    {q:'Où la fécondation a-t-elle lieu habituellement?', o:['Dans une trompe de Fallope','Dans l’utérus','Dans l’ovaire','Dans le vagin'], e:'Le spermatozoïde rencontre l’ovule dans la trompe. L’œuf voyage ensuite jusqu’à l’utérus.'},
    {q:'Quel organe produit les spermatozoïdes?', o:['Les testicules','La prostate','Les vésicules séminales','L’épididyme'], e:'Les testicules produisent les spermatozoïdes et la testostérone. L’épididyme les emmagasine pendant leur maturation.'},
    {q:'Quelles hormones sont produites par les ovaires?', o:['L’œstrogène et la progestérone','La testostérone seulement','L’insuline et le glucagon','L’adrénaline'], e:'Ces hormones règlent le cycle menstruel et préparent la paroi de l’utérus.'},
    {q:'Dans un cycle menstruel de 28 jours, l’ovulation a lieu environ…', o:['vers le 14ᵉ jour','le 1ᵉʳ jour','le 28ᵉ jour','le 7ᵉ jour'], e:'Le jour 1 correspond au début des menstruations; l’ovulation survient vers le milieu du cycle. La durée varie d’une personne à l’autre.'},
    {q:'Qu’est-ce que la nidation?', o:['La fixation de l’embryon dans la paroi de l’utérus','L’union d’un ovule et d’un spermatozoïde','La libération d’un ovule par l’ovaire','L’accouchement'], e:'Quelques jours après la fécondation, l’embryon s’implante dans l’endomètre, la paroi de l’utérus.'},
    {q:'Quelle glande déclenche la puberté en stimulant les organes reproducteurs?', o:['L’hypophyse','La thyroïde','Le pancréas','La rate'], e:'L’hypophyse, à la base du cerveau, sécrète des hormones qui stimulent les testicules et les ovaires.'},
    {q:'Quel moyen protège à la fois contre une grossesse et contre les ITSS?', o:['Le condom','La pilule contraceptive','Le stérilet','L’anneau vaginal'], e:'Les méthodes hormonales préviennent la grossesse, mais seul le condom forme une barrière contre les ITSS.'},
    {q:'Quand l’ovogenèse commence-t-elle?', o:['Avant la naissance : la fille naît avec un stock d’ovules immatures','À la puberté seulement','À l’âge adulte','À chaque menstruation, avec de nouvelles cellules'], e:'Les ovaires contiennent dès la naissance un stock limité. À partir de la puberté, environ un ovule arrive à maturité à chaque cycle, jusqu’à la ménopause.'},
    {q:'Dans l’ovaire, dans quelle structure l’ovule mûrit-il?', o:['Le follicule','Le corps jaune','L’endomètre','Le tube séminifère'], e:'Le follicule entoure l’ovule et le nourrit pendant sa maturation. Il produit aussi de l’œstrogène.'},
    {q:'Où se déroule la spermatogenèse?', o:['Dans les tubes séminifères des testicules','Dans la prostate','Dans l’épididyme','Dans les vésicules séminales'], e:'Les spermatozoïdes sont fabriqués dans les tubes séminifères, puis ils terminent leur maturation dans l’épididyme.'},
    {q:'Qu’est-ce qui distingue la spermatogenèse de l’ovogenèse?', o:['Elle commence à la puberté et se poursuit toute la vie, en continu','Elle commence avant la naissance','Elle produit un seul gamète par mois','Elle s’arrête vers 50 ans'], e:'Dès la puberté, les testicules produisent des millions de spermatozoïdes chaque jour, sans cycle. L’ovogenèse, elle, est cyclique et s’arrête à la ménopause.'},
    {q:'Pourquoi les testicules sont-ils situés dans le scrotum, à l’extérieur du corps?', o:['La spermatogenèse a besoin d’une température un peu plus basse que celle du corps','Pour mieux recevoir le sang','Pour produire l’urine','Pour protéger la vessie'], e:'La production des spermatozoïdes se fait mieux à environ 2 à 3 °C sous la température du corps.'},

  const OL=f||'#24305e', BODY=f||'#dfe6fb', HI=f||'#ffffff', NU=f||'#7d4fc0', NU2=f||'#a37be3', EYE=f||'#14142b', CH=f||'#f59ab0';

/* ---------- Petits pathogènes qui marchent (14×12) ---------- */
function drawMinion(e,sx,sy,t,pal,type){
  sx=Math.round(sx); sy=Math.round(sy);
  if(e.squash>0){ R(sx,sy+8,14,4,pal.o); R(sx+1,sy+9,12,2,pal.a); R(sx+3,sy+9,2,1,'#fff'); R(sx+9,sy+9,2,1,'#fff'); return; }
  const cx=sx+7, cy=sy+5, f=Math.floor(t*8+e.x*0.01)%2, dir=e.vx<0?-1:1;
  if(type==='virus'||type==='supreme'){ for(let k=0;k<7;k++){ const a=k*0.9+t*2; line(cx+Math.cos(a)*5,cy+Math.sin(a)*5,cx+Math.cos(a)*8,cy+Math.sin(a)*8,pal.o); } }
  if(type==='bacille'){ for(let i=0;i<5;i++) R(cx-dir*(8+i),cy+Math.sin(t*12+i)*1.5,1,1,pal.o); }
  R(sx+2+f,sy+10,4,2,pal.o); R(sx+8-f,sy+10,4,2,pal.o);
  if(type==='bacille'){ ell(cx,cy,8,6,pal.o); ell(cx,cy,7,5,pal.a); }
  else if(type==='rocher'){ R(cx-7,cy-5,15,11,pal.o); R(cx-6,cy-4,13,9,pal.a); R(cx-6,cy-6,5,2,pal.o); R(cx+2,cy-6,4,1,pal.o); }
  else { disc(cx,cy,6,pal.o); disc(cx,cy,5,pal.a); }
  R(cx-3,cy-4,2,1,pal.h);
  const ox=dir>0?1:0;
  R(cx-3,cy-1,2,3,'#ffffff'); R(cx+1,cy-1,2,3,'#ffffff'); R(cx-3+ox,cy,1,2,'#14142b'); R(cx+1+ox,cy,1,2,'#14142b');
  R(cx-4,cy-2,3,1,pal.o); R(cx+1,cy-2,3,1,pal.o);
}

/* ---------- Particules de décor ---------- */
let parts=[];
function newPart(type,anywhere){
  const p={type, x:Math.random()*W, y:Math.random()*H, ph:Math.random()*6.28, s:Math.random()};
  if(type==='mix') p.type=['food','bubble','rbc','lymph','drop','spark','cell'][Math.floor(Math.random()*7)];
  switch(p.type){
    case 'food': p.vx=-4-p.s*6; p.vy=(p.s-.5)*2; p.c=['#c98b3a','#7cb342','#e0c070'][Math.floor(p.s*3)]; break;
    case 'bubble': p.vx=0; p.vy=-5-p.s*8; break;
    case 'rbc': p.vx=20+p.s*35; p.vy=0; break;
    case 'lymph': p.vx=(p.s-.5)*6; p.vy=(Math.random()-.5)*6; break;
    case 'drop': p.vx=0; p.vy=14+p.s*12; break;
    case 'fiber': p.vx=-8-p.s*8; p.vy=0; break;
    case 'spark': p.vx=0; p.vy=0; p.life=Math.random(); break;
    case 'cell': p.vx=(p.s-.5)*5; p.vy=-2-p.s*3; break;
    case 'mapcell': p.vx=(p.s-.5)*4; p.vy=(Math.random()-.5)*3; break;
  }
  if(!anywhere){ if(p.vx>0) p.x=-8; else if(p.vx<0) p.x=W+8; if(p.vy<0) p.y=H+8; else if(p.vy>0&&p.vx===0) p.y=-8; }
  return p;
}
function initParts(type,n){ parts=Array.from({length:n},()=>newPart(type,true)); }
function drawParts(dt,t){
  for(const p of parts){
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<-12||p.x>W+12||p.y<-12||p.y>H+12){ Object.assign(p,newPart(p.type,false)); }
    switch(p.type){
      case 'food': R(p.x,p.y,3,3,p.c); break;
      case 'bubble': ring(p.x+Math.sin(t*2+p.ph)*2,p.y,2+Math.round(p.s*1.5),'#ffffff'); break;
      case 'rbc': disc(p.x,p.y,3,'#c62a40'); R(p.x-1,p.y,3,1,'#8d1428'); break;
      case 'lymph': disc(p.x,p.y,2,'#2f9a78'); break;
      case 'drop': R(p.x,p.y,2,3,'#c49a20'); break;
      case 'fiber': R(p.x,p.y,14,1,'#d0756a'); R(p.x+3,p.y+2,10,1,'#d0756a'); break;
      case 'spark': { p.life-=dt*2; if(p.life<0){ p.life=1; p.x=Math.random()*W; p.y=Math.random()*H*0.6; } if(p.life>0.5){ line(p.x,p.y,p.x+3,p.y+3,'#ffe66b'); line(p.x+3,p.y+3,p.x+1,p.y+5,'#ffe66b'); line(p.x+1,p.y+5,p.x+4,p.y+8,'#ffe66b'); } break; }
      case 'cell': ring(p.x,p.y,3,'#d84d8f'); R(p.x,p.y,1,1,'#d84d8f'); break;
      case 'mapcell': ring(p.x,p.y,3+Math.round(p.s*2),'#9cc4ff'); break;
    }
  }
}

/* =========================================================
   NIVEAUX — génération, tuiles, décor
   ========================================================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function buildLevel(idx,opt={}){
  const z=ALL[idx], rnd=mulberry32(4242+idx*7919+(opt.seed||0)), ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const nQ=opt.demo?4:(idx===8?6:5), MAIN=opt.demo?180:24+nQ*19, AR=20, LW=MAIN+AR;
  const h=new Array(LW).fill(10), busy=new Array(LW).fill(false);
  const stairs=[], pits=[];
  let x=0, cur=10;
  const flat=n=>{ for(let i=0;i<n&&x<MAIN;i++) h[x++]=cur; };
  const step=()=>{ cur=Math.max(8,Math.min(10,cur+(rnd()<0.5?-1:1))); };
  flat(12);
  while(x<MAIN-12){
    const r=rnd();
    if(r<0.24 && !opt.demo){ const n=ri(2,3), s=x; for(let i=0;i<n;i++) h[x++]=99; pits.push({x:s,n,h:h[s-1]}); if(rnd()<0.5) step(); flat(ri(4,7)); }
    else if(r<0.44){ step(); flat(ri(5,9)); }
    else if(r<0.58 && !opt.demo){ const s=x; flat(9); stairs.push({x:s+1,h:h[s+1]}); }
    else flat(ri(6,10));
  }
  while(x<MAIN) h[x++]=cur;
  for(let i=MAIN;i<LW;i++) h[i]=10;
  const grid=Array.from({length:ROWS},()=>new Array(LW).fill('.'));
  for(let c=0;c<LW;c++){ if(h[c]>=ROWS) continue; grid[h[c]][c]='G'; for(let r=h[c]+1;r<ROWS;r++) grid[r][c]='D'; }
  stairs.forEach(s=>{ [1,2,3,3,2,1].forEach((k,i)=>{ const c=s.x+i; for(let j=1;j<=k;j++) grid[s.h-j][c]='P'; busy[c]=true; }); busy[s.x-1]=true; busy[s.x+6]=true; });
  pits.forEach(p=>{ for(let i=-1;i<=p.n;i++) busy[p.x+i]=true; });
  const okCol=c=>c>3&&c<MAIN-3&&h[c]<99&&h[c-1]===h[c]&&h[c+1]===h[c]&&!busy[c]&&!busy[c-1]&&!busy[c+1];
  const atps=[], enemies=[], cps=[];
  // blocs du savoir
  let placed=0;
  for(let k=0;k<nQ;k++){
    const tgt=Math.round(14+(k+0.5)*(MAIN-22)/nQ);
    for(let d=0;d<16;d++){
      const c=tgt+(d%2?-1:1)*Math.ceil(d/2); if(!okCol(c)) continue;
      const r=h[c]-4; grid[r][c]='S'; placed++;
      if(rnd()<0.65){ grid[r][c-1]='B'; grid[r][c+1]='B'; }
      if(rnd()<0.5) atps.push({x:c*TS+8,y:(r-1)*TS+8});
      for(let i=-2;i<=2;i++) busy[c+i]=true;
      break;
    }
  }
  // plateformes de briques avec ATP
  for(let k=0;k<(opt.demo?6:3);k++){
    for(let tries=0;tries<20;tries++){
      const c=ri(18,MAIN-10); if(!(okCol(c)&&okCol(c+2))) continue;
      for(let i=0;i<3;i++){ grid[h[c]-4][c+i]='B'; atps.push({x:(c+i)*TS+8,y:(h[c]-5)*TS+8}); busy[c+i]=true; }
      busy[c-1]=busy[c+3]=true; break;
    }
  }
  pits.forEach(p=>{ for(let i=0;i<p.n;i++) atps.push({x:(p.x+i)*TS+8,y:(p.h-3)*TS+8}); });
  for(let k=0;k<4;k++){ const c=ri(14,MAIN-8); if(okCol(c)&&okCol(c+2)) for(let i=0;i<3;i++) atps.push({x:(c+i)*TS+8,y:(h[c]-1)*TS+8}); }
  // petits pathogènes
  if(!opt.demo){
    const n=idx===8?8:6;
    for(let tries=0;tries<120&&enemies.length<n;tries++){
      const c=ri(20,MAIN-8);
      if(h[c]>=99||grid[h[c]-1][c]!=='.'||h[c-1]!==h[c]) continue;
      if(enemies.some(e=>Math.abs(e.x/TS-c)<6)) continue;
      enemies.push({x:c*TS+1,y:h[c]*TS-12,w:14,h:12,vx:-22,vy:0,alive:true,squash:0,on:false});
    }
  }
  // point de contrôle
  [1/3,2/3].forEach(f=>{ for(let d=0;d<30;d++){ const c=Math.floor(MAIN*f)+d; if(h[c]<99&&h[c-1]===h[c]&&grid[h[c]-1][c]==='.'&&grid[h[c]-1][c+1]==='.'&&!enemies.some(e=>Math.abs(e.x/TS-c)<3)){ cps.push({x:c*TS+4,y:h[c]*TS,on:false}); break; } } });
  for(let r=0;r<10;r++) grid[r][LW-1]='P';
  const sup=z.ennemi.type==='supreme';
  const p={x:2*TS+1,y:h[2]*TS-20,w:14,h:20,vx:0,vy:0,face:1,onGround:true,coyote:0,inv:0,jumping:false};
  const pool = idx===8 ? shuffle(FINAL.q.concat(SYS.map(s=>s.q[Math.floor(Math.random()*s.q.length)]))) : shuffle(z.q);
  return {idx,z,th:THEMES[z.id],grid,h,W:LW,MAIN,arenaX:MAIN*TS,enemies,atps,cps,nQ:placed,qDone:0,atp:0,
    p,respawn:{x:p.x,y:p.y},cam:0,mode:'prep',bumps:{},fx:[],pool,pi:0,streak:0,n:0,medal:null,
    boss:{hp:z.hp||5,max:z.hp||5,started:false,dead:false,dying:0,x:(MAIN+15)*TS,y:10*TS-(sup?42:24)}};
}

function drawTile(k,sx,sy,th,c,r,t){
  switch(k){
    case 'G': R(sx,sy,16,16,th.mid); R(sx,sy,16,4,th.top); R(sx+((c*5)%11),sy+4,4,1,th.top); R(sx+((c*7+3)%12),sy+9,2,2,th.dark); R(sx+((c*3+9)%13),sy+13,2,1,th.dark); break;
    case 'D': { R(sx,sy,16,16,th.mid); const k2=(c*7+r*13)%5; R(sx+2+k2*2,sy+3+k2,2,2,th.dark); R(sx+12-k2,sy+11,2,2,th.dark); break; }
    case 'B': R(sx,sy,16,16,th.brick); R(sx,sy,16,1,th.top); R(sx,sy+7,16,1,th.mortar); R(sx,sy+15,16,1,th.mortar); R(sx+7,sy,1,7,th.mortar); R(sx+15,sy,1,7,th.mortar); R(sx+3,sy+8,1,7,th.mortar); R(sx+11,sy+8,1,7,th.mortar); break;
    case 'P': R(sx,sy,16,16,th.dark); R(sx+1,sy+1,14,14,th.hard); R(sx+1,sy+1,14,2,th.top); R(sx+1,sy+1,2,14,th.top); R(sx+5,sy+5,6,6,th.dark); R(sx+6,sy+6,4,4,th.hard); break;
    case 'S': {
      R(sx,sy,16,16,'#0d2a3a'); R(sx+1,sy+1,14,14,'#2ec4b6'); R(sx+1,sy+1,14,2,'#9ff7ec'); R(sx+1,sy+1,2,14,'#9ff7ec'); R(sx+1,sy+13,14,2,'#168a80'); R(sx+13,sy+1,2,14,'#168a80');
      [[3,3],[12,3],[3,12],[12,12]].forEach(([a,b])=>R(sx+a,sy+b,1,1,'#0d2a3a'));
      const glow=Math.floor(t*3)%3===0?'#fff6c0':'#ffe066';
      pix(['.XXXX.','XWWWWX','XWWWWX','XWWWWX','.XWWX.','..XX..','.oooo.','.oooo.','..oo..'],sx+5,sy+3,{X:'#6a4200',W:glow,o:'#d6dde6'});
      break; }
    case 'U': R(sx,sy,16,16,'#3a2a20'); R(sx+1,sy+1,14,14,'#8a7060'); R(sx+1,sy+1,14,1,'#a88c7a'); [[3,3],[12,3],[3,12],[12,12]].forEach(([a,b])=>R(sx+a,sy+b,1,1,'#3a2a20')); break;
  }
}
function drawCloud(x,y){ disc(x+4,y+8,7,'#ffffff'); disc(x+14,y+3,9,'#ffffff'); disc(x+25,y+7,7,'#ffffff'); R(x+4,y+8,22,8,'#ffffff'); R(x+2,y+14,28,2,'#e2ecff'); }
function drawSky(th,cam,t){
  R(0,0,W,H,th.sky[0]); R(0,92,W,H-92,th.sky[1]);
  for(let x=0;x<W;x+=2){ R(x,88+((x>>1)%2)*2,1,1,th.sky[1]); }
  const night=th.deco==='neurons'||th.deco==='mix';
  if(night){ for(let k=0;k<40;k++){ const sx=((k*53-cam*0.1)%W+W)%W, sy=14+(k*29)%80; if((Math.floor(t*2)+k)%5) R(sx,sy,1,1,k%3?'#ffffff':'#ffe66b'); } }
  else { const off=cam*0.2, i0=Math.floor(off/150)-1; for(let i=i0;i<i0+4;i++){ const s=((i%3)+3)%3; drawCloud(i*150-off+30,18+s*12); } }
  const P=110, off=cam*0.4, i0=Math.floor(off/P)-1, F=th.far, F2=th.far2;
  if(th.deco==='vessels'){ for(let x=0;x<W;x++){ R(x,60+Math.sin((x+off)*0.035)*8,1,10,F); R(x,102+Math.sin((x+off)*0.03+2)*7,1,14,F2); } }
  for(let i=i0;i<i0+5;i++){
    const X=i*P-off, s=((i%7)+7)%7;
    switch(th.deco){
      case 'villi': [10,40,72].forEach((dx,j)=>{ const hh=40+((s+j*3)%4)*10, c=j%2?F2:F; R(X+dx-6,150-hh,13,hh,c); disc(X+dx,150-hh,6,c); R(X+dx-3,152-hh,2,hh-6,th.sky[0]); }); break;
      case 'alveoli': { const cx=X+50, cy=96+(s%3)*6; line(cx,cy+20,cx,150,F2); line(cx+1,cy+20,cx+1,150,F2); [[0,0],[-10,6],[10,6],[-5,14],[5,14],[0,22],[-14,16],[14,16]].forEach(([a,b])=>disc(cx+a,cy+b,7,F2)); [[0,0],[-10,6],[10,6],[-5,14],[5,14],[0,22]].forEach(([a,b])=>disc(cx+a-1,cy+b-1,5,F)); break; }
      case 'nodes': { const cx=X+50, cy=104+(s%3)*8; R(X,cy+2,P,2,F2); ell(cx,cy,15,10,F2); ell(cx,cy,12,8,F); ell(cx+3,cy-3,4,3,th.sky[0]); break; }
      case 'drops': { const cx=X+50, by=150; disc(cx,by-16,16,F); for(let k=0;k<22;k++){ const hw=Math.round(k*0.7); R(cx-hw,by-52+k,2*hw+1,1,F); } R(cx-9,by-26,3,8,th.sky[0]); break; }
      case 'bones': { const cx=X+50; R(cx-4,72,9,80,F2); disc(cx-5,72,6,F2); disc(cx+5,72,6,F2); R(cx-3,72,7,80,F); disc(cx-5,72,5,F); disc(cx+5,72,5,F); break; }
      case 'neurons': { const cx=X+50, cy=96+(s%3)*10; [0.3,1.2,2.2,3.3,4.4,5.4].forEach(a=>{ line(cx,cy,cx+Math.cos(a+s)*24,cy+Math.sin(a+s)*20,F); }); line(cx,cy,cx+40,cy+46,F2); disc(cx,cy,7,F); disc(cx,cy,4,F2); break; }
      case 'cells': { const cx=X+50, cy=104+(s%3)*8; disc(cx,cy,18,F); disc(cx,cy,15,F2); disc(cx+4,cy-4,5,F); break; }
      case 'mix': { const cx=X+50, cy=100+(s%3)*8; ring(cx,cy,16,`hsl(${(t*40+i*60)%360},70%,45%)`); ring(cx,cy,10,`hsl(${(t*40+i*60+120)%360},70%,45%)`); break; }
    }
  }
}
function drawTiles(L,cam,now,t){
  const c0=Math.max(0,Math.floor(cam/TS)), c1=Math.min(L.W-1,c0+21);
  for(let c=c0;c<=c1;c++) for(let r=1;r<ROWS;r++){
    const k=L.grid[r][c]; if(k==='.') continue;
    let sx=c*TS-cam, sy=r*TS-VY;
    const key=c+','+r, b=L.bumps[key];
    if(b){ const p=(now-b)/220; if(p<1) sy-=Math.round(Math.sin(p*Math.PI)*5); else delete L.bumps[key]; }
    drawTile(k,sx,sy,L.th,c,r,t);
  }
}

      }, 380+(n-1)*90);

      if(lv) setTimeout(()=>A.sfx('level'),900);

/* =========================================================
   PHYSIQUE DE PLATEFORME
   ========================================================= */
function solid(c,r){ const L=LV; if(c<0||c>=L.W) return true; if(r<0||r>=ROWS) return false; return L.grid[r][c]!=='.'; }
function moveX(o,dt){
  o.x+=o.vx*dt;
  const r0=Math.floor(o.y/TS), r1=Math.floor((o.y+o.h-0.01)/TS);
  if(o.vx>0){ const c=Math.floor((o.x+o.w-0.01)/TS); for(let r=r0;r<=r1;r++) if(solid(c,r)){ o.x=c*TS-o.w; o.vx=0; return true; } }
  else if(o.vx<0){ const c=Math.floor(o.x/TS); for(let r=r0;r<=r1;r++) if(solid(c,r)){ o.x=(c+1)*TS; o.vx=0; return true; } }
  return false;
}
function moveY(o,dt){
  o.y+=o.vy*dt; o.onGround=false;
  const c0=Math.floor(o.x/TS), c1=Math.floor((o.x+o.w-0.01)/TS);
  if(o.vy>0){ const r=Math.floor((o.y+o.h-0.01)/TS); for(let c=c0;c<=c1;c++) if(solid(c,r)){ o.y=r*TS-o.h; o.vy=0; o.onGround=true; return null; } }
  else if(o.vy<0){
    const r=Math.floor(o.y/TS), mid=Math.floor((o.x+o.w/2)/TS); let hit=null;
    if(solid(mid,r)) hit=mid; else for(let c=c0;c<=c1;c++) if(solid(c,r)){ hit=c; break; }
    if(hit!==null){ o.y=(r+1)*TS; o.vy=0; return {c:hit,r}; }
  }
  return null;
}
const overlap=(a,b,s=0)=>a.x+s<b.x+b.w-s && a.x+a.w-s>b.x+s && a.y+s<b.y+b.h-s && a.y+a.h-s>b.y+s;
function squashOn(c,r){ for(const e of LV.enemies) if(e.alive&&!e.squash&&Math.abs(e.x+7-(c*TS+8))<14&&Math.abs(e.y+e.h-r*TS)<3){ e.squash=0.45; addATP(1,e.x,e.y,true); } }
function bump(c,r,now){
  const L=LV; if(r<0||r>=ROWS||c<0||c>=L.W) return;
  const k=L.grid[r][c];
  if(k==='S'){ L.grid[r][c]='U'; L.bumps[c+','+r]=now; A.sfx('block'); squashOn(c,r); blockQuestion(c,r); return; }
  if(k==='B'){ L.bumps[c+','+r]=now; A.sfx('bump'); squashOn(c,r); return; }
  A.sfx('bump');
}
function updateLevel(dt,now){
  const L=LV, p=L.p;
  if(!modal.hidden) return;
  if(L.mode==='question'||L.mode==='done'||L.mode==='ko') return;
  const ctrl=(L.mode==='play'||L.mode==='walk') && !DLG;
  p.inv=Math.max(0,p.inv-dt); jumpBuf=Math.max(0,jumpBuf-dt);
  p.coyote=p.onGround?0.09:Math.max(0,p.coyote-dt);
  let dir=0; if(ctrl){ if(keys.left) dir-=1; if(keys.right) dir+=1; }
  const max=(keys.run&&ctrl)?140:88;
  if(dir){ p.vx+=dir*(p.onGround?640:500)*dt; p.face=dir; if(Math.abs(p.vx)>max) p.vx=Math.sign(p.vx)*Math.max(max,Math.abs(p.vx)-420*dt); }
  else { const f=(p.onGround?760:220)*dt; if(Math.abs(p.vx)<=f) p.vx=0; else p.vx-=Math.sign(p.vx)*f; }
  if(ctrl && jumpBuf>0 && p.coyote>0){ p.vy=-((keys.run&&Math.abs(p.vx)>100)?420:405); p.onGround=false; p.coyote=0; jumpBuf=0; p.jumping=true; A.sfx('jump'); }
  if(p.jumping && !keys.jump && p.vy<-130) p.vy=-130;
  p.vy=Math.min(430,p.vy+930*dt);
  moveX(p,dt);
  if(L.boss.started && p.x<L.arenaX){ p.x=L.arenaX; p.vx=0; }
  const hit=moveY(p,dt);
  if(p.onGround) p.jumping=false;
  if(hit){ p.jumping=false; if(ctrl) bump(hit.c,hit.r,now); if(L.mode==='question') return; }
  // pathogènes
  for(const e of L.enemies){
    if(!e.alive) continue;
    if(e.squash>0){ e.squash-=dt; if(e.squash<=0) e.alive=false; continue; }
    if(!e.on){ if(e.x<L.cam+W+24) e.on=true; else continue; }
    const v=e.vx; e.vy=Math.min(400,e.vy+900*dt);
    if(moveX(e,dt)) e.vx=-v;
    moveY(e,dt);
    if(e.onGround){ const fx=e.vx<0?e.x-1:e.x+e.w+1; if(!solid(Math.floor(fx/TS),Math.floor((e.y+e.h+2)/TS))) e.vx=-e.vx; }
    if(e.y>ROWS*TS+40){ e.alive=false; continue; }
    if(ctrl && overlap(p,e,2)){
      if(p.vy>30 && p.y+p.h-e.y<10){ e.squash=0.45; const hold=keys.jump||jumpBuf>0; p.vy=hold?-470:-320; p.jumping=hold; jumpBuf=0; A.sfx('stomp'); addATP(1,e.x+7,e.y,true); L.fx.push({k:'pop',text:'+1 ATP',x:e.x+7,y:e.y-8,c:'#ffd23f',t0:now,dur:800,size:8}); }
      else hurt(e.x+7,e);
      if(L.mode==='ko') return;
    }
  }
  if(ctrl){
    for(const a of L.atps){ if(!a.taken && overlap(p,{x:a.x-4,y:a.y-5,w:8,h:10})){ a.taken=true; addATP(1,a.x,a.y); } }
    for(const cp of L.cps){ if(!cp.on && overlap(p,{x:cp.x-2,y:cp.y-34,w:14,h:34})){ cp.on=true; L.hasCp=true; L.respawn={x:cp.x,y:cp.y-20}; A.sfx('checkpoint'); L.fx.push({k:'pop',text:'POINT DE CONTRÔLE',x:cp.x+6,y:cp.y-46,c:'#7ff0a4',t0:now,dur:1300,size:8}); } }
    if(L.medal && overlap(p,{x:L.medal.x-9,y:L.medal.y-12,w:18,h:24})){ L.medal=null; levelClear(); return; }
  }
  // chute dans un trou
  if(p.y>ROWS*TS+24){
    hearts--; A.sfx('fall'); shakeHearts(); updateHUD();
    if(hearts<=0){ ko(); return; }
    p.x=L.respawn.x; p.y=L.respawn.y; p.vx=0; p.vy=0; p.inv=INV; L.cam=Math.max(0,p.x-130);
    if(L.mode==='play') showPlayPanel();
  }
  if(L.mode==='play' && !L.boss.started && p.x>L.arenaX+28){ bossIntro(); }

function drawBoss(L,now,t,cam){
  const b=L.boss, z=L.z, fx=L.fx;
  if(b.dead && (!b.dying || now>b.dying+950)) return;
  if(b.dying && now>b.dying+950) return;
  const has=k=>fx.find(f=>f.k===k && now>=f.t0 && now<f.t0+f.dur);
  let ex=b.x-cam, ey=b.y-VY+Math.round(Math.sin(t*2)*2);
  const lu=has('lunge'); if(lu){ const pr=(now-lu.t0)/lu.dur, dist=Math.max(0,ex-(L.p.x+7-cam)-46); ex-=Math.round(Math.sin(pr*Math.PI)*dist); }
  let pal=z.ennemi.pal;
  const ef=has('eflash'); if(ef && Math.floor((now-ef.t0)/70)%2===0) pal=WHITE;
  if(b.dying && now>b.dying){ const pr=(now-b.dying)/950; ey+=Math.round(pr*18); if(Math.floor(pr*24)%2) return; }
  if(ex<-60||ex>W+60) return;
  ENEMY[z.ennemi.type](ex,ey,t,pal);
}
function drawFx(L,now,cam){
  for(const f of L.fx){
    if(now<f.t0 || now>f.t0+f.dur) continue;
    const p=(now-f.t0)/f.dur;
    if(f.k==='proj'){ const x=f.x0+(f.x1-f.x0)*p-cam, y=f.y0+(f.y1-f.y0)*p-Math.sin(p*Math.PI)*18-VY; for(let i=1;i<4;i++) R(x-i*5,y+i*2,2,2,'rgba(248,197,55,'+(0.6-i*0.15)+')'); drawY(x,y,'#f8c537'); }
    if(f.k==='burst'){ for(let k=0;k<12;k++){ const a=k*0.5236, r=6+p*(f.big?44:24); R(f.x-cam+Math.cos(a)*r,f.y-VY+Math.sin(a)*r,2,2,k%2?'#ffe66b':'#ffffff'); } }
    if(f.k==='heal'){ for(let k=0;k<6;k++){ const x=f.x-cam-12+k*5, y=f.y-VY-p*30-(k%2)*6; R(x,y,2,4,'#7ff0a4'); R(x-1,y+1,4,2,'#7ff0a4'); } }
    if(f.k==='tok'){ drawATP(f.x-cam,f.y-VY-Math.sin(p*Math.PI)*22,now/1000); }
    if(f.k==='pop'){ txt(f.text,f.x-cam,f.y-VY-p*14,f.c,f.size||8,'center',FONT_HUD); }
  }
}
function drawLevel(L,t,now,dt){
  const cam=Math.round(L.cam);
  drawSky(L.th,cam,t);
  drawParts(dt,t);
  drawTiles(L,cam,now,t);
  for(const cp of L.cps){ const sx=cp.x-cam; if(sx>-20&&sx<W+20) drawCheckpoint(cp,sx,cp.y-VY,t); }
  for(const a of L.atps){ if(a.taken) continue; const sx=a.x-cam; if(sx>-8&&sx<W+8) drawATP(sx,a.y-VY,t); }
  const pal=L.z.ennemi.pal, type=L.z.ennemi.type;
  for(const e of L.enemies){ if(!e.alive) continue; const sx=e.x-cam; if(sx>-20&&sx<W+20) drawMinion(e,sx,e.y-VY,t,pal,type); }
  drawBoss(L,now,t,cam);
  if(L.medal) drawMedal(L.medal.x-cam,L.medal.y-VY,t,L.z);
  const p=L.p, hf=L.fx.find(f=>f.k==='hflash'&&now>=f.t0&&now<f.t0+f.dur);
  const blink=p.inv>0 && Math.floor(now/(p.inv<0.5?50:90))%2===0;
  if(L.mode==='ko'){ ctx.save(); ctx.globalAlpha=0.5; drawGlobi(p.x-cam,p.y-VY,t,{face:1,onGround:true,vx:0},null); ctx.restore(); }
  else if(!blink) drawGlobi(p.x-cam,p.y-VY,t,p,(hf&&Math.floor((now-hf.t0)/70)%2===0)?'#ff5a6e':null);
  drawFx(L,now,cam);
  // HUD
  const night=L.th.deco==='neurons'||L.th.deco==='mix';
  R(0,0,W,13,night?'rgba(0,0,0,.35)':'rgba(10,20,60,.28)');
  drawATP(8,6,t); txt('×'+String(L.atp).padStart(2,'0'),14,3,'#ffffff',8,'left',FONT_HUD);
  txt((L.idx===8?'CŒUR':L.z.court).toUpperCase(),160,3,'#ffffff',8,'center',FONT_HUD);
  txt('SAVOIR '+L.qDone+'/'+L.nQ,316,3,'#ffffff',8,'right',FONT_HUD);
  if(!modal.hidden && scene==='level'){ R(0,0,W,H,'rgba(0,0,0,.45)'); txt('PAUSE',160,82,'#ffffff',16,'center',FONT_HUD); }
}

  const act=KEYMAP[e.code];
  if(playing() && act){ e.preventDefault(); if(!e.repeat) pressGame(act); else keys[act]=true; return; }
  if(scene==='level' && Q && !Q.answered && !DLG){
    if(e.repeat || performance.now()-Q.t0<350) { if(act) e.preventDefault(); return; }

  }

  if(e.key.startsWith('Arrow') && scene!=='level'){
    const bs=[...panel.querySelectorAll('button:not(:disabled)')]; if(!bs.length) return;
    e.preventDefault(); let i=bs.indexOf(document.activeElement);

  if((e.key==='Enter'||e.key===' ') && DLG && !(document.activeElement && document.activeElement.tagName==='BUTTON')){ e.preventDefault(); ACT.dlgNext(); }

  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',e=>e.preventDefault());
});

// le son démarre au premier geste
const unlock=()=>{ A.init(); window.removeEventListener('pointerdown',unlock,true); window.removeEventListener('keydown',unlock,true); };
window.addEventListener('pointerdown',unlock,true); window.addEventListener('keydown',unlock,true);
try{ if(localStorage.getItem(SAVE_KEY+'-mute')==='1'){ A.setMuted(true); $('#pSound').setAttribute('aria-pressed','false'); } }catch(e){}

/* ---------- Boucle de rendu ---------- */
let last=performance.now();
function frame(now){
  const t=now/1000, dt=Math.min(0.033,(now-last)/1000); last=now;
  ctx.setTransform(2,0,0,2,0,0);
  if(shakeUntil>now) ctx.translate(Math.round(Math.random()*4-2),Math.round(Math.random()*4-2));
  try{
    if(scene==='title'||scene==='intro') drawTitle(t,now,dt);
    else if(scene==='map') drawMap(t,now,dt);
    else if((scene==='prep'||scene==='level') && LV){
      if(scene==='level'){ updateLevel(dt,now); if(LV) LV.fx=LV.fx.filter(f=>now<f.t0+f.dur+50); }
      if(LV) drawLevel(LV,t,now,dt);
    }
    else if(scene==='end') drawEnding(t,now,dt);
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
if(document.fonts && document.fonts.load){ document.fonts.load('600 16px "Pixelify Sans"').catch(()=>{}); document.fonts.load('8px "Press Start 2P"').catch(()=>{}); }
updateHUD(); toTitle(); requestAnimationFrame(frame);
</script>
